name: ATIS Capabilities V3 Integration

on:
  push:
    branches: [atis-capabilities-v3]
    paths:
      - '.github/workflows/atis-capabilities-v3-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atis-capabilities-v3
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch assistant, webhook, provider and frontend integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- assistant.ts ----------
          p = Path('supabase/functions/_shared/atis/assistant.ts')
          s = p.read_text()
          old = 'import { cultoLookup, isCultoIntent } from "./culto-lookup.ts";\n'
          new = old + 'import { canticosLookup, isCanticosIntent } from "./assistant-extras.ts";\n'
          if 'from "./assistant-extras.ts"' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '  | "harpa_lookup"\n  | "culto_info";'
          new = '  | "harpa_lookup"\n  | "culto_info"\n  | "canticos_info";'
          if '| "canticos_info"' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = 'export type AtisAssistantOptions = {\n  allowedAiRoutes?: string[] | null;\n  conversationHistory?: AtisConversationMessage[];\n};'
          new = 'export type AtisAssistantOptions = {\n  allowedAiRoutes?: string[] | null;\n  conversationHistory?: AtisConversationMessage[];\n  conversationMode?: "normal" | "study" | "concise";\n  destinationInstruction?: string | null;\n};'
          if 'conversationMode?:' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = 'function deterministicIntent(message: string): AtisAssistantRoute | null {\n  const q = normalize(message);\n  if (isCultoIntent(message)) return "culto_info";'
          new = 'function deterministicIntent(message: string): AtisAssistantRoute | null {\n  const q = normalize(message);\n  if (isCanticosIntent(message)) return "canticos_info";\n  if (isCultoIntent(message)) return "culto_info";'
          if 'isCanticosIntent(message)' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '["ask_bible", "exegetai", "chapter_summary", "word_meaning", "connections", "timeline", "devotional", "daily_verse", "birthdays", "bible_lookup", "harpa_lookup", "culto_info"]'
          new = '["ask_bible", "exegetai", "chapter_summary", "word_meaning", "connections", "timeline", "devotional", "daily_verse", "birthdays", "bible_lookup", "harpa_lookup", "culto_info", "canticos_info"]'
          if '"culto_info", "canticos_info"]' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          start = s.index('async function harpaLookup(')
          end = s.index('\nfunction requestedMonth(', start)
          new_harpa = r'''async function harpaLookup(supabase: any, config: any, message: string, history: AtisConversationMessage[] = []) {
            const url = `${config.baseUrl}/harpa/harpa-crista.json`;
            const raw = await fetchJsonCached(url, "harpa") as any;
            const hymns = Array.isArray(raw?.hinos) ? raw.hinos : [];
            const q = normalize(message);
            const numberMatch = q.match(/(?:harpa|hino)(?:\s+(?:numero|n|nº|no))?\s*(\d{1,3})/);
            let number = numberMatch ? Number(numberMatch[1]) : null;

            if (!number) {
              for (const item of [...history].reverse()) {
                if (item.role !== "assistant") continue;
                const match = item.content.match(/Harpa Cristã\s+(\d{1,3})\s+—/i);
                if (match) { number = Number(match[1]); break; }
              }
            }

            let hymn = number ? hymns.find((row: any) => Number(row?.numero) === number) : null;
            if (!hymn) {
              hymn = hymns.find((row: any) => {
                const title = normalize(String(row?.titulo ?? ""));
                return title.length >= 5 && q.includes(title);
              });
            }

            if (!hymn) {
              const phraseMatch = q.match(/(?:trecho|letra|fala|diz)(?:\s+(?:que|do|da))?\s+(.{5,})$/);
              const phrase = normalize(phraseMatch?.[1] ?? "");
              if (phrase.length >= 5) {
                hymn = hymns.find((row: any) => {
                  const sections = Array.isArray(row?.secoes) ? row.secoes : [];
                  const lyrics = normalize(sections.flatMap((section: any) => Array.isArray(section?.linhas) ? section.linhas : []).join(" "));
                  return lyrics.includes(phrase);
                });
              }
            }

            if (!hymn) return { text: "🎵 Não encontrei esse hino na Harpa Cristã cadastrada no app.", reference: null };

            const { data: override } = await supabase.from("harpa_overrides").select("number,title,secoes").eq("number", hymn.numero).maybeSingle();
            const title = firstString(override?.title, hymn?.titulo) ?? `Hino ${hymn.numero}`;
            const sections = Array.isArray(override?.secoes) ? override.secoes : Array.isArray(hymn?.secoes) ? hymn.secoes : [];

            if (/\b(qual|diga|numero|número)\b.*\b(numero|número)\b|\bnumero desse hino\b|\bnúmero desse hino\b/.test(q)) {
              return { text: `🎵 É o *Hino ${hymn.numero} da Harpa Cristã — ${title}*.`, reference: `Harpa ${hymn.numero}` };
            }

            const onlyChorus = /\b(refrao|refrão|coro)\b/.test(q);
            const selectedSections = onlyChorus ? sections.filter((section: any) => section?.tipo === "refrao" || section?.chorus === true) : sections;
            if (onlyChorus && !selectedSections.length) {
              return { text: `🎵 O *Hino ${hymn.numero} — ${title}* não possui um refrão identificado separadamente no acervo do app.`, reference: `Harpa ${hymn.numero}` };
            }
            const body = selectedSections.map((section: any) => {
              const heading = section?.tipo === "refrao" || section?.chorus === true ? "Refrão" : section?.numero ? `${section.numero}ª estrofe` : "Estrofe";
              const lines = Array.isArray(section?.linhas) ? section.linhas.map((line: any) => String(line).replace(/^\s*[-–—]+\s*/, "")).filter(Boolean) : [];
              return `*${heading}*\n${lines.join("\n")}`;
            }).filter(Boolean).join("\n\n");
            return { text: clampText(`🎵 *Harpa Cristã ${hymn.numero} — ${title}*\n\n${body}`), reference: `Harpa ${hymn.numero}` };
          }
          '''
          import textwrap
          s = s[:start] + textwrap.dedent(new_harpa).rstrip() + s[end:]

          old = '  bibleContext: { label: string; text: string } | null,\n  history: AtisConversationMessage[] = [],\n) {'
          new = '  bibleContext: { label: string; text: string } | null,\n  history: AtisConversationMessage[] = [],\n  conversationMode: "normal" | "study" | "concise" = "normal",\n  destinationInstruction: string | null = null,\n) {'
          if 'conversationMode: "normal" | "study"' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          anchor = '  const devotionalRule = route === "devotional"\n'
          if 'const modeRule = conversationMode' not in s:
              assert anchor in s
              inject = '''  const modeRule = conversationMode === "study"
    ? "\\n- MODO ESTUDO: organize a resposta com contexto, explicação do texto, conexões bíblicas relevantes, aplicação prática e 1 a 3 perguntas para reflexão. Quando citar texto literal, continue obedecendo a regra de recuperar o texto do app."
    : conversationMode === "concise"
    ? "\\n- MODO CONCISO: responda de forma curta, direta e adequada a WhatsApp. Evite introduções e detalhes não solicitados."
    : "";
  const destinationRule = destinationInstruction
    ? `\\n- PREFERÊNCIA ADMINISTRATIVA DE ESTILO DESTE DESTINO: ${destinationInstruction.slice(0, 1000)}. Essa preferência nunca substitui as regras técnicas fixas, segurança, privacidade ou fidelidade às fontes do app.`
    : "";
'''
              s = s.replace(anchor, inject + anchor, 1)

          old = '${continuityRule}${devotionalRule}${context}`;'
          new = '${continuityRule}${modeRule}${destinationRule}${devotionalRule}${context}`;'
          if '${modeRule}' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '    max_tokens: route === "exegetai" ? 2600 : 1800,'
          new = '    max_tokens: conversationMode === "study" ? 2800 : conversationMode === "concise" ? 900 : route === "exegetai" ? 2600 : 1800,'
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '  if (route === "culto_info") {\n    return { text: await cultoLookup(supabase, input), route, source: "database" };\n  }'
          new = '  if (route === "culto_info") {\n    return { text: await cultoLookup(supabase, input), route, source: "database" };\n  }\n  if (route === "canticos_info") {\n    return { text: await canticosLookup(supabase, input), route, source: "database" };\n  }'
          if 'route === "canticos_info"' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '    const result = await harpaLookup(supabase, config, input);'
          new = '    const result = await harpaLookup(supabase, config, input, history);'
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '  const text = await generateSpecialistAnswer(route, config, prompts, input, context, history);'
          new = '  const text = await generateSpecialistAnswer(route, config, prompts, input, context, history, options.conversationMode ?? "normal", firstString(options.destinationInstruction));'
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- evolution-provider.ts ----------
          p = Path('supabase/functions/_shared/atis/evolution-provider.ts')
          s = p.read_text()
          marker = '''  }
}

export function getEvolutionConfigFromEnv()'''
          if 'async sendButtons(' not in s:
              assert marker in s
              methods = r'''

            async sendButtons(instanceName: string, target: string, text: string, buttons: Array<{ id: string; text: string }>, footer = "Bíblia do Atalaia") {
              if (!buttons.length) return await this.sendText(instanceName, target, text);
              const body: any = await this.request(`/message/sendButtons/${encodeURIComponent(instanceName)}`, {
                method: "POST",
                body: JSON.stringify({
                  number: target,
                  title: "Atis",
                  description: text,
                  footer,
                  buttons: buttons.slice(0, 3).map((button) => ({
                    type: "reply",
                    displayText: button.text.slice(0, 40),
                    id: button.id.slice(0, 120),
                  })),
                }),
              }, 30000);
              return { raw: body, providerMessageId: providerMessageId(body), status: firstString(body?.status, body?.data?.status), sentText: text };
            }

            async sendAudio(instanceName: string, target: string, audio: Uint8Array, mimetype = "audio/wav") {
              let binary = "";
              const chunk = 0x8000;
              for (let index = 0; index < audio.length; index += chunk) {
                binary += String.fromCharCode(...audio.subarray(index, Math.min(index + chunk, audio.length)));
              }
              const media = btoa(binary);
              const body: any = await this.request(`/message/sendMedia/${encodeURIComponent(instanceName)}`, {
                method: "POST",
                body: JSON.stringify({
                  number: target,
                  mediatype: "audio",
                  mimetype,
                  media,
                  fileName: "atis-resposta.wav",
                }),
              }, 45000);
              return { raw: body, providerMessageId: providerMessageId(body), status: firstString(body?.status, body?.data?.status) };
            }
          '''
              s = s.replace(marker, '  }' + textwrap.dedent(methods).rstrip() + '\n}\n\nexport function getEvolutionConfigFromEnv()', 1)
          p.write_text(s)

          # ---------- conversation-runtime safe defaults ----------
          p = Path('supabase/functions/_shared/atis/conversation-runtime.ts')
          s = p.read_text().replace('mention_only: type === "group",', 'mention_only: false,')
          # Recognize both button IDs and their visible labels.
          old = '''export function normalizeButtonCommand(message: string) {
  const value = message.trim().toLowerCase();
  if (value === "atis:mode:study") return "modo estudo";
  if (value === "atis:devotional") return "reflexão devocional";
  if (value === "atis:app") return "__ATIS_OPEN_APP__";
  return message;
}'''
          new = '''export function normalizeButtonCommand(message: string) {
  const value = message.trim().toLowerCase();
  const plain = normalize(message).replace(/^[^a-z0-9]+/g, "");
  if (value === "atis:mode:study" || plain.includes("modo estudo")) return "modo estudo";
  if (value === "atis:devotional" || plain.includes("devocional")) return "reflexão devocional";
  if (value === "atis:app" || plain.includes("abrir app")) return "__ATIS_OPEN_APP__";
  return message;
}'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- atis-console safe defaults + richer group metrics ----------
          p = Path('supabase/functions/atis-console/index.ts')
          s = p.read_text().replace('mention_only: type === "group",', 'mention_only: false,')
          old = '''  const groupCounts = new Map<string, number>();
  for (const row of seven) if (row.is_group && groupByJid.has(row.remote_jid)) groupCounts.set(row.remote_jid, (groupCounts.get(row.remote_jid) ?? 0) + 1);
  const group_metrics = [...groupCounts.entries()].map(([jid, count]) => ({ id: groupByJid.get(jid)?.id, name: groupByJid.get(jid)?.name, messages_7d: count })).sort((a, b) => b.messages_7d - a.messages_7d).slice(0, 12);'''
          new = '''  const groupCounts = new Map<string, number>();
  const groupRoutes = new Map<string, Map<string, number>>();
  for (const row of seven) {
    if (!row.is_group || !groupByJid.has(row.remote_jid)) continue;
    groupCounts.set(row.remote_jid, (groupCounts.get(row.remote_jid) ?? 0) + 1);
    const route = row.assistant_route || "sem_rota";
    const routes = groupRoutes.get(row.remote_jid) ?? new Map<string, number>();
    routes.set(route, (routes.get(route) ?? 0) + 1);
    groupRoutes.set(row.remote_jid, routes);
  }
  const group_metrics = [...groupCounts.entries()].map(([jid, count]) => {
    const routes = [...(groupRoutes.get(jid)?.entries() ?? [])].sort((a, b) => b[1] - a[1]);
    return { id: groupByJid.get(jid)?.id, name: groupByJid.get(jid)?.name, messages_7d: count, top_route: routes[0]?.[0] ?? null, top_route_count: routes[0]?.[1] ?? 0, routes: routes.slice(0, 3).map(([route, route_count]) => ({ route, count: route_count })) };
  }).sort((a, b) => b.messages_7d - a.messages_7d).slice(0, 12);'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- atis-webhook.ts ----------
          p = Path('supabase/functions/atis-webhook/index.ts')
          s = p.read_text()
          old = 'import { EvolutionProvider, getEvolutionConfigFromEnv } from "../_shared/atis/evolution-provider.ts";\n'
          new = old + '''import {
  appendContinueInApp,
  assistantButtons,
  confirmationCommand,
  consumeReplyBudget,
  conversationModeCommand,
  isPrayerIntent,
  isQuietNow,
  loadConversationState,
  loadDestinationProfile,
  looksUnanswered,
  normalizeButtonCommand,
  prayerContent,
  recordUnanswered,
  rememberAnswer,
  resolvePendingPrayer,
  setConversationMode,
  startPrayerConfirmation,
  type DestinationProfile,
  type DestinationType as ConversationDestinationType,
} from "../_shared/atis/conversation-runtime.ts";
'''
          if 'conversation-runtime.ts' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          helper_marker = '\nasync function processInboundMessages(supabase: any, instance: any, data: any) {'
          helper_code = r'''

          async function sendReplyWithProfile(
            provider: EvolutionProvider,
            instanceName: string,
            target: string,
            text: string,
            profile: DestinationProfile,
            route: string | null,
            withButtons = false,
          ) {
            let sent: any = null;
            let usedButtons = false;
            if (withButtons && profile.enable_buttons && route) {
              try {
                sent = await provider.sendButtons(instanceName, target, text, assistantButtons(route));
                usedButtons = true;
              } catch (error) {
                console.error("[atis-webhook] interactive buttons failed; falling back to text", error instanceof Error ? error.message : error);
              }
            }
            if (!sent) sent = await provider.sendText(instanceName, target, text);

            let audioSent = false;
            if (profile.enable_audio && text.length <= 1800) {
              try {
                const supabaseUrl = Deno.env.get("SUPABASE_URL") ?? "";
                const serviceKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") ?? "";
                if (supabaseUrl && serviceKey) {
                  const cleanText = text.replace(/https?:\/\/\S+/g, "").replace(/[\*_`>#]/g, " ").replace(/\s+/g, " ").trim().slice(0, 1200);
                  if (cleanText.length >= 8) {
                    const response = await fetch(`${supabaseUrl}/functions/v1/tts-verse`, {
                      method: "POST",
                      headers: { Authorization: `Bearer ${serviceKey}`, apikey: serviceKey, "Content-Type": "application/json" },
                      body: JSON.stringify({ text: cleanText }),
                    });
                    if (response.ok) {
                      const bytes = new Uint8Array(await response.arrayBuffer());
                      if (bytes.length > 44 && bytes.length < 8_000_000) {
                        await provider.sendAudio(instanceName, target, bytes, response.headers.get("content-type") || "audio/wav");
                        audioSent = true;
                      }
                    } else {
                      console.error("[atis-webhook] optional TTS unavailable", response.status);
                    }
                  }
                }
              } catch (error) {
                console.error("[atis-webhook] optional audio reply failed", error instanceof Error ? error.message : error);
              }
            }
            return { sent, usedButtons, audioSent };
          }
          '''
          if 'async function sendReplyWithProfile(' not in s:
              assert helper_marker in s
              s = s.replace(helper_marker, textwrap.dedent(helper_code).rstrip() + helper_marker, 1)

          start = s.index('async function processInboundMessages(')
          end = s.index('\nDeno.serve(async (req) => {', start)
          new_process = r'''async function processInboundMessages(supabase: any, instance: any, data: any) {
            const runtime = await assistantRuntime(supabase);
            if (!runtime.enabled) return { received: 0, replied: 0, ignored: 0, failed: 0 };

            let evolution: EvolutionProvider | null = null;
            let ownerMentionIds: string[] | null = null;
            const counts = { received: 0, replied: 0, ignored: 0, failed: 0 };
            const providerInstanceName = instance.external_instance_name || instance.name;

            for (const item of messageEntries(data).slice(0, 20)) {
              const providerMessageId = messageId(item);
              const remoteJid = inboundRemoteJid(item);
              const rawText = inboundText(item);
              if (!providerMessageId || !remoteJid || !rawText || inboundFromMe(item)) {
                counts.ignored++;
                continue;
              }

              const isGroup = remoteJid.endsWith("@g.us");
              const limitedText = rawText.slice(0, runtime.maxInboundChars);
              const commandText = normalizeButtonCommand(limitedText);
              const senderName = inboundSenderName(item);
              const { data: inbound, error: insertError } = await supabase
                .from("atis_inbound_messages")
                .insert({
                  instance_id: instance.id,
                  provider_message_id: providerMessageId,
                  remote_jid: remoteJid,
                  sender_name: senderName,
                  message_text: limitedText,
                  is_group: isGroup,
                  status: "received",
                  metadata: { truncated: rawText.length > limitedText.length },
                })
                .select("id")
                .single();

              if (insertError?.code === "23505") { counts.ignored++; continue; }
              if (insertError) throw insertError;
              counts.received++;

              // App contacts can revoke WhatsApp consent by sending exactly SAIR.
              if (!isGroup && isContactOptOutCommand(limitedText)) {
                const phone = remoteJidPhone(remoteJid);
                if (phone) {
                  const { data: contact, error: contactError } = await supabase
                    .from("atis_contacts")
                    .select("id,user_id,name,phone_e164")
                    .eq("source", "app")
                    .eq("phone_e164", phone)
                    .maybeSingle();
                  if (contactError) throw contactError;
                  if (contact) {
                    const now = new Date().toISOString();
                    if (contact.user_id) {
                      const { error: profileError } = await supabase.from("profiles").update({ whatsapp_opt_in: false }).eq("user_id", contact.user_id);
                      if (profileError) throw profileError;
                    }
                    const { error: contactUpdateError } = await supabase.from("atis_contacts").update({
                      whatsapp_opt_in: false,
                      opt_out_at: now,
                      opt_out_source: "whatsapp_keyword",
                      reactivation_requires_app: true,
                      consent_updated_at: now,
                    }).eq("id", contact.id);
                    if (contactUpdateError) throw contactUpdateError;
                    await supabase.from("atis_message_targets").update({
                      status: "cancelled",
                      last_error_code: "CONTACT_OPTED_OUT",
                      last_error_message: "Recipient sent SAIR. Reactivation is allowed only from the app.",
                      updated_at: now,
                    }).eq("contact_id", contact.id).eq("status", "pending");
                    const confirmation = "✅ Pronto! Você não receberá mais mensagens do ATIS. Para reativar, abra o app *A Bíblia do Atalaia* → *Perfil* → *Notificações no WhatsApp* e autorize novamente. 🙏";
                    if (!evolution) { const config = getEvolutionConfigFromEnv(); evolution = new EvolutionProvider({ baseUrl: config.baseUrl, apiKey: config.apiKey }); }
                    const sent = await evolution.sendText(providerInstanceName, directProviderTarget(remoteJid), confirmation);
                    await supabase.from("atis_inbound_messages").update({ assistant_route: null, response_text: confirmation, status: "replied", processed_at: now, error: null, metadata: { action: "contact_opt_out", contact_id: contact.id, provider_response_message_id: sent.providerMessageId ?? null } }).eq("id", inbound.id);
                    counts.replied++;
                    continue;
                  }
                }
              }

              const autoReplyAllowed = isGroup ? runtime.autoReplyGroups : runtime.autoReplyDirect;
              if (!autoReplyAllowed) {
                await supabase.from("atis_inbound_messages").update({ status: "ignored", processed_at: new Date().toISOString(), metadata: { policy: "auto_reply_disabled" } }).eq("id", inbound.id);
                counts.ignored++;
                continue;
              }

              let policyForFailure: any = null;
              try {
                const policy = await resolveDestinationAiPolicy(supabase, instance, remoteJid);
                policyForFailure = policy;
                if (policy.blocked || !policy.destinationType || !policy.destinationId) {
                  await supabase.from("atis_inbound_messages").update({ status: "ignored", processed_at: new Date().toISOString(), metadata: { destination_type: policy.destinationType, destination_id: policy.destinationId, policy: "blocked_or_unknown" } }).eq("id", inbound.id);
                  counts.ignored++;
                  continue;
                }
                const destinationType = policy.destinationType as ConversationDestinationType;
                const destinationId = policy.destinationId as string;
                const profile = await loadDestinationProfile(supabase, destinationType, destinationId);
                const state = await loadConversationState(supabase, instance.id, remoteJid, destinationType, destinationId, profile.conversation_mode);

                // Per-group mention-only can be enabled independently from the global switch.
                if (isGroup && (runtime.groupMentionOnly || profile.mention_only)) {
                  let addressedToAtis = textCallsAtis(limitedText);
                  const mentionedJids = inboundMentionedJids(item);
                  if (!addressedToAtis && mentionedJids.length > 0) {
                    if (ownerMentionIds === null) {
                      ownerMentionIds = providerOwnerMentionIds({ ownerJid: instance?.metadata?.owner_jid, owner: instance?.metadata?.owner, number: instance?.metadata?.owner_number });
                      if (!ownerMentionIds.length) {
                        try {
                          if (!evolution) { const config = getEvolutionConfigFromEnv(); evolution = new EvolutionProvider({ baseUrl: config.baseUrl, apiKey: config.apiKey }); }
                          ownerMentionIds = providerOwnerMentionIds(await evolution.fetchInstances(providerInstanceName));
                        } catch (error) {
                          console.error("[atis-webhook] could not resolve own JID for group mention", error instanceof Error ? error.message : error);
                          ownerMentionIds = [];
                        }
                      }
                    }
                    const mentioned = inboundMentionedJids(item).map(normalizeMentionIdentity).filter(Boolean) as string[];
                    addressedToAtis = mentioned.some((id) => ownerMentionIds?.includes(id));
                  }
                  if (!addressedToAtis) {
                    await supabase.from("atis_inbound_messages").update({ status: "ignored", processed_at: new Date().toISOString(), metadata: { policy: "group_mention_only", destination_type: destinationType, destination_id: destinationId } }).eq("id", inbound.id);
                    counts.ignored++;
                    continue;
                  }
                }

                if (isQuietNow(profile)) {
                  await supabase.from("atis_inbound_messages").update({ status: "ignored", processed_at: new Date().toISOString(), metadata: { policy: "quiet_hours", destination_type: destinationType, destination_id: destinationId } }).eq("id", inbound.id);
                  counts.ignored++;
                  continue;
                }

                let specialReply: string | null = null;
                let specialRoute: string | null = null;
                const mode = conversationModeCommand(commandText);
                const confirmation = confirmationCommand(commandText);

                if (commandText === "__ATIS_OPEN_APP__") {
                  specialReply = "📱 Continue na *Bíblia do Atalaia*:\nhttps://biblia.atalaias.online";
                  specialRoute = "open_app";
                } else if (mode) {
                  await setConversationMode(supabase, state.id, mode.mode);
                  state.conversation_mode = mode.mode;
                  specialReply = mode.text;
                  specialRoute = "conversation_mode";
                } else if (!isGroup && confirmation && state?.pending_action?.type === "prayer_request") {
                  specialReply = await resolvePendingPrayer(supabase, state, confirmation, { instanceId: instance.id, remoteJid, senderName, destinationType, destinationId });
                  specialRoute = "prayer_request";
                } else if (isPrayerIntent(commandText)) {
                  if (isGroup) {
                    specialReply = "🙏 Para proteger sua privacidade, envie o pedido de oração *no privado do ATIS*. Eu só registro o pedido depois de pedir sua confirmação.";
                  } else {
                    specialReply = await startPrayerConfirmation(supabase, state.id, prayerContent(commandText));
                  }
                  specialRoute = "prayer_request";
                }

                const budget = await consumeReplyBudget(supabase, instance.id, remoteJid, profile);
                if (budget?.allowed !== true) {
                  await supabase.from("atis_inbound_messages").update({ status: "ignored", processed_at: new Date().toISOString(), metadata: { policy: String(budget?.reason ?? "rate_limit").toLowerCase(), retry_after_seconds: budget?.retry_after_seconds ?? null, destination_type: destinationType, destination_id: destinationId } }).eq("id", inbound.id);
                  counts.ignored++;
                  continue;
                }

                if (!evolution) { const config = getEvolutionConfigFromEnv(); evolution = new EvolutionProvider({ baseUrl: config.baseUrl, apiKey: config.apiKey }); }

                if (specialReply) {
                  const delivery = await sendReplyWithProfile(evolution, providerInstanceName, directProviderTarget(remoteJid), specialReply, { ...profile, enable_audio: false }, specialRoute, false);
                  await supabase.from("atis_inbound_messages").update({ assistant_route: specialRoute, response_text: specialReply, status: "replied", processed_at: new Date().toISOString(), error: null, metadata: { destination_type: destinationType, destination_id: destinationId, provider_response_message_id: delivery.sent?.providerMessageId ?? null, special_action: specialRoute } }).eq("id", inbound.id);
                  counts.replied++;
                  continue;
                }

                await supabase.from("atis_inbound_messages").update({ status: "processing" }).eq("id", inbound.id);
                const conversationHistory = await loadConversationHistory(supabase, instance.id, remoteJid, runtime.historyInteractions);
                const styleInstruction = [
                  profile.response_style === "concise" ? "Prefira respostas curtas." : profile.response_style === "detailed" ? "Quando útil, dê uma explicação um pouco mais detalhada." : null,
                  profile.custom_instruction,
                ].filter(Boolean).join(" ");
                const answer = await runAtisAssistant(supabase, commandText, {
                  allowedAiRoutes: policy.allowedAiRoutes,
                  conversationHistory,
                  conversationMode: state.conversation_mode ?? profile.conversation_mode,
                  destinationInstruction: styleInstruction || null,
                });
                const answerText = appendContinueInApp(answer.text, answer.route, profile.continue_in_app, answer.reference);
                const delivery = await sendReplyWithProfile(evolution, providerInstanceName, directProviderTarget(remoteJid), answerText, profile, answer.route, true);
                await rememberAnswer(supabase, state.id, answer.route, answer.reference, commandText);
                if (looksUnanswered(answerText, answer.route)) {
                  await recordUnanswered(supabase, { inboundId: inbound.id, destinationType, destinationId, question: limitedText, route: answer.route, answer: answerText, reason: "assistant_uncertain" });
                }
                await supabase.from("atis_inbound_messages").update({
                  assistant_route: answer.route,
                  response_text: answerText,
                  status: "replied",
                  processed_at: new Date().toISOString(),
                  error: null,
                  metadata: {
                    answer_source: answer.source,
                    answer_reference: answer.reference ?? null,
                    provider_response_message_id: delivery.sent?.providerMessageId ?? null,
                    destination_type: destinationType,
                    destination_id: destinationId,
                    conversation_mode: state.conversation_mode ?? profile.conversation_mode,
                    buttons_sent: delivery.usedButtons,
                    audio_sent: delivery.audioSent,
                    history_interactions_used: Math.floor(conversationHistory.length / 2),
                    history_messages_used: conversationHistory.length,
                  },
                }).eq("id", inbound.id);
                counts.replied++;
              } catch (error) {
                const message = error instanceof Error ? error.message : "ATIS_ASSISTANT_INBOUND_ERROR";
                console.error("[atis-webhook] inbound assistant failed", message);
                await supabase.from("atis_inbound_messages").update({ status: "failed", error: message.slice(0, 500), processed_at: new Date().toISOString() }).eq("id", inbound.id);
                if (policyForFailure?.destinationType && policyForFailure?.destinationId) {
                  try {
                    await recordUnanswered(supabase, { inboundId: inbound.id, destinationType: policyForFailure.destinationType, destinationId: policyForFailure.destinationId, question: limitedText, reason: `error:${message.slice(0, 120)}` });
                  } catch (recordError) {
                    console.error("[atis-webhook] could not record unanswered", recordError instanceof Error ? recordError.message : recordError);
                  }
                }
                counts.failed++;
              }
            }

            return counts;
          }
          '''
          s = s[:start] + textwrap.dedent(new_process).rstrip() + s[end:]
          p.write_text(s)

          # ---------- AtisDestinationSettings.tsx ----------
          p = Path('src/components/admin/atis/AtisDestinationSettings.tsx')
          s = p.read_text()
          import_anchor = 'import { supabase } from "@/integrations/supabase/client";\n'
          if 'AtisConversationProfile' not in s:
              assert import_anchor in s
              s = s.replace(import_anchor, import_anchor + 'import AtisConversationProfile from "./AtisConversationProfile";\n', 1)
              section_anchor = '''              <section className="rounded-2xl border border-[hsl(var(--dark-card-hover))] overflow-hidden">
                <div className="p-4 bg-[hsl(var(--dark-bg))] flex items-start gap-3">
                  <BrainCircuit'''
              replacement = '''              <AtisConversationProfile destinationType={destinationType} destinationId={destinationId} />

              <section className="rounded-2xl border border-[hsl(var(--dark-card-hover))] overflow-hidden">
                <div className="p-4 bg-[hsl(var(--dark-bg))] flex items-start gap-3">
                  <BrainCircuit'''
              assert section_anchor in s
              s = s.replace(section_anchor, replacement, 1)
          p.write_text(s)

          # ---------- AtisPage.tsx ----------
          p = Path('src/pages/AtisPage.tsx')
          s = p.read_text()
          imports_anchor = 'import AtisSettings from "@/components/admin/atis/AtisSettings";\n'
          if 'AtisSend from' not in s:
              assert imports_anchor in s
              s = s.replace(imports_anchor, imports_anchor + 'import AtisSend from "@/components/admin/atis/AtisSend";\nimport AtisAutomations from "@/components/admin/atis/AtisAutomations";\nimport AtisHistory from "@/components/admin/atis/AtisHistory";\n', 1)

          bool_anchor = '  const settings = location.pathname.startsWith("/atis/configuracoes");\n  const dashboard = location.pathname === "/atis";'
          bool_new = '  const settings = location.pathname.startsWith("/atis/configuracoes");\n  const sendView = location.pathname.startsWith("/atis/enviar");\n  const automationsView = location.pathname.startsWith("/atis/automacoes");\n  const historyView = location.pathname.startsWith("/atis/historico");\n  const dashboard = location.pathname === "/atis";'
          if 'const sendView =' not in s:
              assert bool_anchor in s
              s = s.replace(bool_anchor, bool_new, 1)

          old = '''          <span className="h-9 px-4 rounded-xl shrink-0 grid place-items-center text-xs font-semibold bg-[hsl(var(--dark-card))]/60 text-[hsl(var(--dark-muted))]/50">Enviar</span>
          <span className="h-9 px-4 rounded-xl shrink-0 grid place-items-center text-xs font-semibold bg-[hsl(var(--dark-card))]/60 text-[hsl(var(--dark-muted))]/50">Automações</span>
          <span className="h-9 px-4 rounded-xl shrink-0 grid place-items-center text-xs font-semibold bg-[hsl(var(--dark-card))]/60 text-[hsl(var(--dark-muted))]/50">Histórico</span>'''
          new = '''          <button onClick={() => navigate("/atis/enviar")} className={`h-9 px-4 rounded-xl shrink-0 text-xs font-bold flex items-center gap-2 ${sendView ? "bg-primary text-primary-foreground" : "bg-[hsl(var(--dark-card))] text-[hsl(var(--dark-muted))]"}`}><Send className="w-4 h-4" /> Enviar</button>
          <button onClick={() => navigate("/atis/automacoes")} className={`h-9 px-4 rounded-xl shrink-0 text-xs font-bold flex items-center gap-2 ${automationsView ? "bg-primary text-primary-foreground" : "bg-[hsl(var(--dark-card))] text-[hsl(var(--dark-muted))]"}`}><WandSparkles className="w-4 h-4" /> Automações</button>
          <button onClick={() => navigate("/atis/historico")} className={`h-9 px-4 rounded-xl shrink-0 text-xs font-bold flex items-center gap-2 ${historyView ? "bg-primary text-primary-foreground" : "bg-[hsl(var(--dark-card))] text-[hsl(var(--dark-muted))]"}`}><History className="w-4 h-4" /> Histórico</button>'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '        {recipients ? <AtisRecipients /> : birthdays ? <AtisBirthdays /> : settings ? <AtisSettings /> : connection ? <AdminAtis initialView="connection" /> : <AdminAtis initialView="overview" />}'
          new = '        {recipients ? <AtisRecipients /> : birthdays ? <AtisBirthdays /> : settings ? <AtisSettings /> : sendView ? <AtisSend /> : automationsView ? <AtisAutomations /> : historyView ? <AtisHistory /> : connection ? <AdminAtis initialView="connection" /> : <AdminAtis initialView="overview" />}'
          if '<AtisSend />' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '''              {[
                ["Enviar", Send, "Em breve"],
                ["Automações", WandSparkles, "Em breve"],
                ["Histórico", History, "Em breve"],
              ].map(([label, Icon, status]: any) => (
                <div key={label} className="rounded-2xl bg-[hsl(var(--dark-bg))] p-3 min-h-[92px] flex flex-col items-center justify-center text-center opacity-55">
                  <Icon className="w-5 h-5 text-primary" />
                  <p className="text-[11px] font-bold mt-2">{label}</p>
                  <p className="text-[9px] text-[hsl(var(--dark-muted))] mt-0.5">{status}</p>
                </div>
              ))}'''
          new = '''              {[
                ["Enviar", Send, "/atis/enviar"],
                ["Automações", WandSparkles, "/atis/automacoes"],
                ["Histórico", History, "/atis/historico"],
              ].map(([label, Icon, path]: any) => (
                <button key={label} onClick={() => navigate(path)} className="rounded-2xl bg-[hsl(var(--dark-bg))] p-3 min-h-[92px] flex flex-col items-center justify-center text-center active:scale-95 transition">
                  <Icon className="w-5 h-5 text-primary" />
                  <p className="text-[11px] font-bold mt-2">{label}</p>
                  <p className="text-[9px] text-emerald-400 mt-0.5">Disponível</p>
                </button>
              ))}'''
          if '"Em breve"' in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '${moreOpen || settings ? "text-primary" : "text-[hsl(var(--dark-muted))]"}'
          new = '${moreOpen || settings || sendView || automationsView || historyView ? "text-primary" : "text-[hsl(var(--dark-muted))]"}'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- AtisHistory richer group metric typing ----------
          p = Path('src/components/admin/atis/AtisHistory.tsx')
          s = p.read_text()
          s = s.replace('group_metrics: Array<{ id?: string; name?: string; messages_7d: number }>;', 'group_metrics: Array<{ id?: string; name?: string; messages_7d: number; top_route?: string | null; top_route_count?: number }>;')
          old = '<span className="flex-1 truncate">{row.name || "Grupo"}</span><strong>{row.messages_7d}</strong>'
          new = '<span className="flex-1 truncate">{row.name || "Grupo"}{row.top_route ? <span className="block text-[8px] text-[hsl(var(--dark-muted))] mt-0.5">Mais perguntado: {row.top_route}</span> : null}</span><strong>{row.messages_7d}</strong>'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Deno checks
        run: |
          deno check supabase/functions/_shared/atis/assistant-extras.ts
          deno check supabase/functions/_shared/atis/conversation-runtime.ts
          deno check supabase/functions/_shared/atis/assistant.ts
          deno check supabase/functions/_shared/atis/evolution-provider.ts
          deno check supabase/functions/atis-console/index.ts
          deno check supabase/functions/atis-webhook/index.ts
          deno check supabase/functions/atis-destination-settings/index.ts

      - name: Frontend build
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npm run build

      - name: Commit integrated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/atis/assistant.ts \
            supabase/functions/_shared/atis/evolution-provider.ts \
            supabase/functions/_shared/atis/conversation-runtime.ts \
            supabase/functions/atis-console/index.ts \
            supabase/functions/atis-webhook/index.ts \
            src/components/admin/atis/AtisDestinationSettings.tsx \
            src/components/admin/atis/AtisHistory.tsx \
            src/pages/AtisPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate ATIS conversation capabilities"
          git push origin HEAD:atis-capabilities-v3
