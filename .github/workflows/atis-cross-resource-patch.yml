name: Wire ATIS Cross Resource Context

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-cross-resource-patch.yml'

permissions:
  contents: write

jobs:
  patch-check-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Wire structured ministry context into assistant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/_shared/atis/assistant.ts')
          text = path.read_text()

          replacements = [
            (
              'import { canticosLookup, isCanticosIntent } from "./assistant-extras.ts";\n',
              'import { canticosLookup, isCanticosIntent } from "./assistant-extras.ts";\nimport { captureCultoReference, captureSongListReference, resolveMinistryFollowup } from "./ministry-context.ts";\n',
            ),
            (
              '''  let route = deterministicIntent(input);\n  if (!route) route = await classifyWithAi(config.systemPrompt, input, history);\n''',
              '''  const ministryFollowup = resolveMinistryFollowup(input, history);\n  const effectiveInput = ministryFollowup?.message ?? input;\n  let route = ministryFollowup?.route ?? deterministicIntent(effectiveInput);\n  if (!route) route = await classifyWithAi(config.systemPrompt, effectiveInput, history);\n''',
            ),
            (
              '''  if (route === "culto_info") {\n    return { text: await cultoLookup(supabase, input), route, source: "database" };\n  }\n  if (route === "canticos_info") {\n    return { text: await canticosLookup(supabase, input), route, source: "database" };\n  }\n''',
              '''  if (route === "culto_info") {\n    const text = await cultoLookup(supabase, effectiveInput);\n    const reference = await captureCultoReference(supabase, effectiveInput);\n    return { text, route, source: "database", reference };\n  }\n  if (route === "canticos_info") {\n    const text = await canticosLookup(supabase, effectiveInput);\n    const reference = ministryFollowup?.carryReference ?? await captureSongListReference(supabase, effectiveInput);\n    return { text, route, source: "database", reference };\n  }\n''',
            ),
            (
              '''  if (route === "harpa_lookup") {\n    const result = await harpaLookup(supabase, config, input, history);\n    return { text: result.text, route, source: "app", reference: result.reference };\n  }\n''',
              '''  if (route === "harpa_lookup") {\n    const result = await harpaLookup(supabase, config, effectiveInput, history);\n    return { text: result.text, route, source: "app", reference: ministryFollowup?.carryReference ?? result.reference };\n  }\n''',
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one assistant.ts anchor, found {count}: {old[:80]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check ATIS webhook bundle
        run: deno check supabase/functions/atis-webhook/index.ts

      - name: Commit routed assistant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atis-review-bot"
          git config user.email "atis-review-bot@users.noreply.github.com"
          git add supabase/functions/_shared/atis/assistant.ts
          git diff --cached --check
          git commit -m "feat(atis): route ministry follow-ups from structured memory"
          git push origin HEAD:agent/atis-backend-hardening-context

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS webhook only
        run: supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID"
