name: Fix and Deploy ATIS Direct Inbound

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-direct-inbound-fix.yml'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Patch direct inbound policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('supabase/functions/atis-webhook/index.ts')
          text = path.read_text()

          old_import = 'import { structuredConversationContext } from "../_shared/atis/context-memory.ts";\n'
          new_import = old_import + 'import { directPhoneCandidates, inboundSessionDestinationId, preferredPhoneMatch } from "../_shared/atis/direct-recipient.ts";\n'
          if 'direct-recipient.ts' not in text:
              if old_import not in text:
                  raise SystemExit('context-memory import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_phone = '''function remoteJidPhone(remoteJid: string) {
            if (remoteJid.endsWith("@g.us")) return null;
            const digits = directProviderTarget(remoteJid).replace(/\\D/g, "");
            return digits.length >= 8 && digits.length <= 15 ? `+${digits}` : null;
          }'''
          new_phone = '''function remoteJidPhone(remoteJid: string) {
            return directPhoneCandidates(remoteJid)[0] ?? null;
          }'''
          if old_phone in text:
              text = text.replace(old_phone, new_phone, 1)

          marker = 'async function resolveDestinationAiPolicy(supabase: any, instance: any, remoteJid: string) {'
          if marker not in text:
              raise SystemExit('policy function anchor not found')

          helper_and_policy = r'''async function findDirectRecipient(supabase: any, remoteJid: string) {
            const phoneCandidates = directPhoneCandidates(remoteJid);
            if (!phoneCandidates.length) return null;

            const { data: contacts, error: contactError } = await supabase
              .from("atis_contacts")
              .select("id,user_id,name,phone_e164,blocked,is_active,whatsapp_opt_in,reactivation_requires_app")
              .in("phone_e164", phoneCandidates);
            if (contactError) throw contactError;
            const contact = preferredPhoneMatch(contacts, phoneCandidates);
            if (contact) return { type: "contact" as const, record: contact, phoneCandidates };

            const { data: individuals, error: individualError } = await supabase
              .from("atis_individuals")
              .select("id,name,phone_e164,blocked,is_active,allow_messages")
              .in("phone_e164", phoneCandidates);
            if (individualError) throw individualError;
            const individual = preferredPhoneMatch(individuals, phoneCandidates);
            if (individual) return { type: "individual" as const, record: individual, phoneCandidates };

            return null;
          }

          async function resolveDestinationAiPolicy(supabase: any, instance: any, remoteJid: string) {
            let type: DestinationType | null = null;
            let id: string | null = null;
            let blocked = false;
            let transientDirect = false;
            let matchedPhone: string | null = null;

            if (remoteJid.endsWith("@g.us")) {
              const { data, error } = await supabase
                .from("atis_groups")
                .select("id,is_active,provider_exists")
                .eq("instance_id", instance.id)
                .eq("provider_group_id", remoteJid)
                .eq("is_active", true)
                .maybeSingle();
              if (error) throw error;
              if (!data || data.provider_exists === false) {
                return { destinationType: null, destinationId: null, blocked: true, allowedAiRoutes: [] as string[], transientDirect: false, matchedPhone: null };
              }
              type = "group";
              id = data.id;
            } else {
              const known = await findDirectRecipient(supabase, remoteJid);
              if (known?.type === "contact") {
                type = "contact";
                id = known.record.id;
                matchedPhone = known.record.phone_e164 ?? null;
                blocked = known.record.blocked === true
                  || known.record.is_active !== true
                  || known.record.whatsapp_opt_in !== true
                  || known.record.reactivation_requires_app === true;
              } else if (known?.type === "individual") {
                type = "individual";
                id = known.record.id;
                matchedPhone = known.record.phone_e164 ?? null;
                blocked = known.record.blocked === true
                  || known.record.is_active !== true
                  || known.record.allow_messages !== true;
              } else {
                // A private user who initiates a conversation may use the assistant
                // without becoming an outbound recipient. The deterministic UUID is
                // conversation-only: it is not inserted into contacts/individuals and
                // therefore cannot receive broadcasts or automations.
                type = "individual";
                id = await inboundSessionDestinationId(remoteJid);
                transientDirect = true;
              }
            }

            if (!type || !id) {
              return { destinationType: null, destinationId: null, blocked: true, allowedAiRoutes: [] as string[], transientDirect: false, matchedPhone };
            }
            if (blocked) {
              return { destinationType: type, destinationId: id, blocked: true, allowedAiRoutes: [] as string[], transientDirect: false, matchedPhone };
            }
            if (transientDirect) {
              return { destinationType: type, destinationId: id, blocked: false, allowedAiRoutes: [...AI_FEATURE_KEYS], transientDirect: true, matchedPhone: null };
            }

            const column = type === "contact" ? "contact_id" : type === "individual" ? "individual_id" : "group_id";
            const { data: rows, error } = await supabase
              .from("atis_destination_feature_settings")
              .select("feature_key,enabled")
              .eq("destination_type", type)
              .eq(column, id)
              .eq("feature_kind", "ai");
            if (error) throw error;

            const stored = new Map((rows ?? []).map((row: any) => [row.feature_key, row.enabled === true]));
            const defaultEnabled = true;
            const allowedAiRoutes = AI_FEATURE_KEYS.filter((key) => stored.has(key) ? stored.get(key) === true : defaultEnabled);
            return { destinationType: type, destinationId: id, blocked: false, allowedAiRoutes, transientDirect: false, matchedPhone };
          }
          '''

          pattern = re.compile(r'async function resolveDestinationAiPolicy\(supabase: any, instance: any, remoteJid: string\) \{.*?\n\}\n\n\nasync function sendReplyWithProfile', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('could not isolate policy function')
          text = text[:match.start()] + helper_and_policy + '\nasync function sendReplyWithProfile' + text[match.end():]

          optout_pattern = re.compile(r'    if \(!isGroup && isContactOptOutCommand\(limitedText\)\) \{.*?\n    \}\n\n    const autoReplyAllowed', re.S)
          optout_match = optout_pattern.search(text)
          if not optout_match:
              raise SystemExit('opt-out block anchor not found')
          new_optout = r'''    if (!isGroup && isContactOptOutCommand(limitedText)) {
              const known = await findDirectRecipient(supabase, remoteJid);
              const now = new Date().toISOString();
              let confirmation = "✅ Tudo certo. Este número não está cadastrado para envios automáticos do ATIS, então não há assinatura ativa para cancelar. 🙏";
              let action = "guest_no_subscription";
              let recipientId: string | null = null;

              if (known?.type === "contact") {
                const contact = known.record;
                recipientId = contact.id;
                if (contact.user_id) {
                  const { error: profileError } = await supabase.from("profiles").update({ whatsapp_opt_in: false }).eq("user_id", contact.user_id);
                  if (profileError) throw profileError;
                }
                const { error: contactUpdateError } = await supabase.from("atis_contacts").update({
                  whatsapp_opt_in: false,
                  opt_out_at: now,
                  opt_out_source: "whatsapp_keyword",
                  reactivation_requires_app: true,
                  consent_updated_at: now,
                }).eq("id", contact.id);
                if (contactUpdateError) throw contactUpdateError;
                await supabase.from("atis_message_targets").update({
                  status: "cancelled",
                  last_error_code: "CONTACT_OPTED_OUT",
                  last_error_message: "Recipient sent SAIR. Reactivation is allowed only from the app.",
                  updated_at: now,
                }).eq("contact_id", contact.id).eq("status", "pending");
                confirmation = "✅ Pronto! Você não receberá mais mensagens automáticas do ATIS. Para reativar, abra o app *A Bíblia do Atalaia* → *Perfil* → *Notificações no WhatsApp* e autorize novamente. 🙏";
                action = "contact_opt_out";
              } else if (known?.type === "individual") {
                recipientId = known.record.id;
                const { error: individualError } = await supabase.from("atis_individuals").update({ allow_messages: false }).eq("id", known.record.id);
                if (individualError) throw individualError;
                await supabase.from("atis_message_targets").update({
                  status: "cancelled",
                  last_error_code: "INDIVIDUAL_OPTED_OUT",
                  last_error_message: "Recipient sent SAIR.",
                  updated_at: now,
                }).eq("individual_id", known.record.id).eq("status", "pending");
                confirmation = "✅ Pronto! Os envios automáticos do ATIS para este número foram desativados. 🙏";
                action = "individual_opt_out";
              }

              if (!evolution) {
                const config = getEvolutionConfigFromEnv();
                evolution = new EvolutionProvider({ baseUrl: config.baseUrl, apiKey: config.apiKey });
              }
              const sent = await evolution.sendText(providerInstanceName, directProviderTarget(remoteJid), confirmation);
              await supabase.from("atis_inbound_messages").update({
                assistant_route: null,
                response_text: confirmation,
                status: "replied",
                processed_at: now,
                error: null,
                metadata: { action, recipient_id: recipientId, provider_response_message_id: sent.providerMessageId ?? null },
              }).eq("id", inbound.id);
              counts.replied++;
              continue;
            }

            const autoReplyAllowed'''
          text = text[:optout_match.start()] + new_optout + text[optout_match.end():]

          text = text.replace(
              '      } else if (!isGroup && confirmation && state?.pending_action?.type === "prayer_request") {',
              '      } else if (!isGroup && policy.transientDirect !== true && confirmation && state?.pending_action?.type === "prayer_request") {',
              1,
          )
          old_prayer = '''        } else {
                  specialReply = await startPrayerConfirmation(supabase, state.id, prayerContent(commandText));
                }
                specialRoute = "prayer_request";'''
          new_prayer = '''        } else if (policy.transientDirect === true) {
                  specialReply = "🙏 Recebi seu pedido. Posso conversar com você por aqui normalmente. Para *registrar* um pedido de oração no painel privado para acompanhamento da liderança, primeiro vincule e autorize este WhatsApp no app *A Bíblia do Atalaia*.";
                } else {
                  specialReply = await startPrayerConfirmation(supabase, state.id, prayerContent(commandText));
                }
                specialRoute = "prayer_request";'''
          if old_prayer not in text:
              raise SystemExit('prayer branch anchor not found')
          text = text.replace(old_prayer, new_prayer, 1)

          # Make guest-vs-registered behavior observable without storing extra personal content.
          text = text.replace(
              'metadata: { destination_type: destinationType, destination_id: destinationId, provider_response_message_id: delivery.sent?.providerMessageId ?? null, special_action: specialRoute }',
              'metadata: { destination_type: destinationType, destination_id: destinationId, provider_response_message_id: delivery.sent?.providerMessageId ?? null, special_action: specialRoute, transient_direct: policy.transientDirect === true, matched_phone: policy.matchedPhone ?? null }',
              1,
          )
          text = text.replace(
              '          context_memory_reason: structuredContext.reason,\n',
              '          context_memory_reason: structuredContext.reason,\n          transient_direct: policy.transientDirect === true,\n          matched_phone: policy.matchedPhone ?? null,\n',
              1,
          )

          path.write_text(text)
          PY

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test direct identity and existing ministry context
        run: |
          deno test supabase/functions/_shared/atis/direct-recipient_test.ts
          deno test supabase/functions/_shared/atis/ministry-context_test.ts

      - name: Type-check complete webhook
        run: deno check supabase/functions/atis-webhook/index.ts

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add supabase/functions/atis-webhook/index.ts
          git diff --cached --check
          git commit -m "fix(atis): allow safe direct inbound conversations"
          git push origin HEAD:agent/atis-backend-hardening-context

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS webhook only
        run: supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID"
