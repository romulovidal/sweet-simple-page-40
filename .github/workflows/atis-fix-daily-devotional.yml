name: Fix ATIS daily devotional source

on:
  push:
    paths:
      - '.github/workflows/atis-fix-daily-devotional.yml'
      - '.github/scripts/patch_atis_daily_devotional.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ATIS daily devotional patch
        run: python .github/scripts/patch_atis_daily_devotional.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/atis/assistant.ts
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: anchor ATIS devotional to current daily verse'
          git push
