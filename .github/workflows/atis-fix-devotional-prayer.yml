name: Fix ATIS devotional prayer

on:
  push:
    paths:
      - '.github/workflows/atis-fix-devotional-prayer.yml'
      - '.github/scripts/patch_atis_devotional_prayer.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ATIS devotional prayer patch
        run: python .github/scripts/patch_atis_devotional_prayer.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check ATIS Edge Functions
        run: |
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts
          deno check supabase/functions/atis-content-runner/index.ts

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/atis/assistant.ts
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: enforce real prayer in ATIS devotional'
          git push
