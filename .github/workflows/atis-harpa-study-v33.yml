name: Validate and Deploy ATIS Harpa Study v33

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-harpa-study-v33.yml'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-test-build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Apply Harpa study routing patch
        run: python scripts/atis-harpa-study-v33-patch.py

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Harpa routing and regressions
        run: |
          deno test supabase/functions/_shared/atis/harpa-study-routing_test.ts
          deno test supabase/functions/_shared/atis/direct-recipient_test.ts
          deno test supabase/functions/_shared/atis/failure-fallback_test.ts
          deno test supabase/functions/_shared/atis/ministry-context_test.ts

      - name: Type-check affected functions
        run: |
          deno check supabase/functions/atis-webhook/index.ts
          deno check supabase/functions/atis-destination-settings/index.ts
          deno check supabase/functions/atis-harpa-study/index.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm install --package-lock=false --ignore-scripts
          npm run build

      - name: Commit validated Harpa study integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add \
            supabase/functions/_shared/atis/assistant.ts \
            supabase/functions/_shared/atis/harpa-study-routing_test.ts \
            supabase/functions/atis-webhook/index.ts \
            supabase/functions/atis-destination-settings/index.ts
          git diff --cached --check
          git commit -m "feat(atis): route grounded contextual Harpa study"
          git push origin HEAD:agent/atis-backend-hardening-context

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS Harpa study integration
        run: |
          supabase functions deploy atis-harpa-study --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy atis-destination-settings --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
