name: Harden ATIS Harpa Study v33b

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-harpa-study-v33b.yml'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-check-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Apply grounding hardening
        run: python scripts/atis-harpa-study-v33b-hardening.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Harpa study
        run: deno check supabase/functions/atis-harpa-study/index.ts

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add supabase/functions/atis-harpa-study/index.ts
          git diff --cached --check
          git commit -m "fix(atis): enforce verified Bible references in Harpa study"
          git push origin HEAD:agent/atis-backend-hardening-context

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy Harpa study
        run: supabase functions deploy atis-harpa-study --project-ref "$SUPABASE_PROJECT_ID"
