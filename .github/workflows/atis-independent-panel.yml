name: ATIS Independent Panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atis-independent-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Move ATIS to independent shortcut
        run: python scripts/patch_atis_independent.py
      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(atis): expose independent ATIS panel from admin home"
          git push
