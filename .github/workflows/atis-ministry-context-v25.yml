name: Validate and Deploy ATIS Ministry Context v25

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-ministry-context-v25.yml'
      - 'supabase/functions/_shared/atis/ministry-context.ts'
      - 'supabase/functions/_shared/atis/ministry-context_test.ts'
      - 'supabase/functions/_shared/atis/culto-lookup.ts'

permissions:
  contents: read

jobs:
  test-check-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run ministry context tests
        run: deno test supabase/functions/_shared/atis/ministry-context_test.ts

      - name: Type-check ATIS webhook bundle
        run: deno check supabase/functions/atis-webhook/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS webhook only
        run: supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID"
