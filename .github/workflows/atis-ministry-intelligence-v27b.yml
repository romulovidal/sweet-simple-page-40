name: Validate ATIS Ministry Intelligence v27b

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-ministry-intelligence-v27b.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Apply reviewed ministry intelligence patch
        run: python scripts/atis-ministry-intelligence-patch.py

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run ATIS regression and ministry intelligence tests
        run: |
          deno test supabase/functions/_shared/atis/direct-recipient_test.ts
          deno test supabase/functions/_shared/atis/ministry-context_test.ts
          deno test supabase/functions/_shared/atis/ministry-intelligence_test.ts
          deno test supabase/functions/_shared/atis/ministry-relation-routing_test.ts

      - name: Type-check complete webhook
        run: deno check supabase/functions/atis-webhook/index.ts

      - name: Commit validated v27 code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add supabase/functions/_shared/atis/ministry-intelligence.ts supabase/functions/_shared/atis/ministry-context.ts supabase/functions/_shared/atis/assistant.ts supabase/functions/atis-webhook/index.ts
          git diff --cached --check
          git commit -m "feat(atis): ground culto Bible and worship relations"
          git push origin HEAD:agent/atis-backend-hardening-context
