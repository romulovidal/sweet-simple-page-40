name: Validate and Deploy ATIS Unanswered v28

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-unanswered-v28.yml'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-test-build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Apply supervised unanswered patch
        run: python scripts/atis-unanswered-v28-patch.py

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run ATIS regression suites
        run: |
          deno test supabase/functions/_shared/atis/unanswered-intelligence_test.ts
          deno test supabase/functions/_shared/atis/direct-recipient_test.ts
          deno test supabase/functions/_shared/atis/ministry-context_test.ts
          deno test supabase/functions/_shared/atis/ministry-intelligence_test.ts
          deno test supabase/functions/_shared/atis/ministry-relation-routing_test.ts

      - name: Type-check ATIS Edge Functions
        run: |
          deno check supabase/functions/atis-webhook/index.ts
          deno check supabase/functions/atis-console/index.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm install --package-lock=false --ignore-scripts
          npm run build

      - name: Commit validated code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add \
            supabase/functions/_shared/atis/conversation-runtime.ts \
            supabase/functions/_shared/atis/unanswered-intelligence_test.ts \
            supabase/functions/atis-webhook/index.ts \
            supabase/functions/atis-console/index.ts \
            src/components/admin/atis/AtisHistory.tsx
          git diff --cached --check
          git commit -m "feat(atis): add supervised unanswered review intelligence"
          git push origin HEAD:agent/atis-backend-hardening-context

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"
          test -f supabase/migrations/20260817220131_atis_unanswered_review_queue.sql

      - name: Deploy ATIS webhook and console
        run: |
          supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy atis-console --project-ref "$SUPABASE_PROJECT_ID"
