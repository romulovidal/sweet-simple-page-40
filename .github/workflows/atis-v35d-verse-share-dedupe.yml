name: Validate Native Verse Share Dedupe v35d

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-v35d-verse-share-dedupe.yml'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-check-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Apply native share dedupe fix
        run: python scripts/atis-v35d-verse-share-dedupe.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check native share and ATIS callers
        run: |
          deno check supabase/functions/create-verse-share/index.ts
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts

      - name: Commit validated v35d
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add supabase/functions/create-verse-share/index.ts
          git diff --cached --check
          git commit -m "fix(share): deduplicate verse links by exact passage and version"
          git push origin HEAD:agent/atis-backend-hardening-context

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy native verse share function
        run: supabase functions deploy create-verse-share --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
