name: Validate ATIS Webhook Link Egress v35e

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-v35e-webhook-link-egress.yml'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-check-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Apply webhook egress guard
        run: python scripts/atis-v35e-webhook-link-egress.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test and type-check
        run: |
          deno test supabase/functions/_shared/atis/link-policy_test.ts
          deno check supabase/functions/atis-webhook/index.ts

      - name: Commit validated egress guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add supabase/functions/atis-webhook/index.ts
          git diff --cached --check
          git commit -m "fix(atis): enforce verse-only links at webhook egress"
          git push origin HEAD:agent/atis-backend-hardening-context

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy webhook
        run: supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
