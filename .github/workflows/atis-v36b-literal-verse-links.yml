name: Validate ATIS v36b Literal Verse Links

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - '.github/workflows/atis-v36b-literal-verse-links.yml'
      - 'scripts/atis-v36b-literal-verse-links.py'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-test-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-backend-hardening-context
          fetch-depth: 0

      - name: Apply v36b fix
        run: python scripts/atis-v36b-literal-verse-links.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run ATIS regression tests
        run: |
          deno test supabase/functions/_shared/atis/link-policy_test.ts
          deno test supabase/functions/_shared/atis/context-routing_test.ts

      - name: Type-check deployed functions
        run: |
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend build regression
        run: |
          npm install --package-lock=false --ignore-scripts
          npm run build

      - name: Commit validated v36b
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add supabase/functions/_shared/atis/assistant.ts
          git diff --cached --check
          git commit -m "fix(atis): link every literal verified Bible passage"
          git push origin HEAD:agent/atis-backend-hardening-context

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS functions
        run: |
          supabase functions deploy atis-ai --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
