name: Validate ATIS v41 Natural Conversation

on:
  push:
    branches:
      - agent/atis-v41-natural-conversation
    paths:
      - '.github/workflows/atis-v41-natural-conversation.yml'
      - 'scripts/atis-v41-natural-conversation.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/atis-v41-natural-conversation.yml'
      - 'scripts/atis-v41-natural-conversation.py'

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-test-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-v41-natural-conversation
          fetch-depth: 0

      - name: Apply v41 natural conversation patch
        run: python scripts/atis-v41-natural-conversation.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run ATIS regressions
        run: |
          deno test supabase/functions/_shared/atis/context-routing_test.ts
          deno test supabase/functions/_shared/atis/link-policy_test.ts
          deno test supabase/functions/_shared/atis/response-style_test.ts

      - name: Type-check affected functions
        run: |
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts

      - name: Commit validated v41
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add supabase/functions/_shared/atis/assistant.ts supabase/functions/_shared/atis/response-style_test.ts supabase/migrations/20260818093830_atis_natural_conversation_tone.sql
          git diff --cached --check
          git commit -m "fix(atis): restore natural conversational answers"
          git push origin HEAD:agent/atis-v41-natural-conversation

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS functions
        run: |
          supabase functions deploy atis-ai --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
