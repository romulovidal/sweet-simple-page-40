name: Validate ATIS v44 Natural Output

on:
  push:
    branches:
      - agent/atis-v44-natural-output-harpa-devotional
    paths:
      - '.github/workflows/atis-v44-natural-output-harpa-devotional.yml'
      - 'scripts/atis-v44-natural-output-harpa-devotional.py'
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  patch-test-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-v44-natural-output-harpa-devotional
          fetch-depth: 0

      - name: Apply v44 patch
        run: python scripts/atis-v44-natural-output-harpa-devotional.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run ATIS regressions
        run: |
          deno test supabase/functions/_shared/atis/context-routing_test.ts
          deno test supabase/functions/_shared/atis/link-policy_test.ts
          deno test supabase/functions/_shared/atis/response-style_test.ts

      - name: Type-check affected functions
        run: |
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts
          deno check supabase/functions/atis-harpa-study/index.ts

      - name: Reject known broken output scaffolding
        run: |
          ! grep -R "trecho literal omitido" -n supabase/functions/atis-harpa-study supabase/functions/_shared/atis/assistant.ts
          ! grep -R "uma passagem bíblica relacionada" -n supabase/functions/atis-harpa-study

      - name: Commit validated v44
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "romulovidal"
          git config user.email "romulo_vidal@live.com"
          git add \
            supabase/functions/_shared/atis/assistant.ts \
            supabase/functions/_shared/atis/context-routing_test.ts \
            supabase/functions/_shared/atis/response-style_test.ts \
            supabase/functions/atis-harpa-study/index.ts
          git diff --cached --check
          git commit -m "fix(atis): stabilize natural Bible Harpa and devotional output"
          git push origin HEAD:agent/atis-v44-natural-output-harpa-devotional

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS functions
        run: |
          supabase functions deploy atis-ai --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy atis-harpa-study --project-ref "$SUPABASE_PROJECT_ID"
