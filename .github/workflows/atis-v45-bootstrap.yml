name: Bootstrap validated ATIS v45

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atis-v45-bootstrap.yml'

permissions:
  contents: write

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: karyuuhxeismshhxuokg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-v45-canonical-bible-engine
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply v45 integration patch
        run: python scripts/atis-v45-canonical-engine.py

      - name: Run ATIS regression tests
        run: |
          deno test supabase/functions/_shared/atis/canonical-bible_test.ts
          deno test supabase/functions/_shared/atis/context-routing_test.ts
          deno test supabase/functions/_shared/atis/response-style_test.ts
          deno test supabase/functions/_shared/atis/link-policy_test.ts

      - name: Type-check production functions
        run: |
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit functional v45 files to branch
        run: |
          git config user.name 'romulovidal'
          git config user.email 'romulo_vidal@live.com'
          git add \
            supabase/functions/_shared/atis/assistant.ts \
            supabase/functions/_shared/atis/conversation-runtime.ts \
            supabase/functions/_shared/atis/evolution-provider.ts \
            supabase/functions/atis-webhook/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(atis): build canonical Bible evidence and harden delivery'
            git push origin HEAD:agent/atis-v45-canonical-bible-engine
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy v45 backend
        run: |
          test "$SUPABASE_PROJECT_ID" = 'karyuuhxeismshhxuokg'
          supabase functions deploy atis-ai --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID"
