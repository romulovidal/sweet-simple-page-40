name: ATIS v46.2 Canonical Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch-atis-v46-2.py'
      - 'supabase/functions/_shared/atis/canonical-bible.ts'
      - 'supabase/functions/_shared/atis/canonical-bible_test.ts'
      - 'supabase/functions/_shared/atis/semantic-bible.ts'
      - 'supabase/functions/_shared/atis/semantic-bible_test.ts'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply v46.2 patch
        run: |
          sed -i 's/validate_pattern.subn(validate_replacement, canonical)/validate_pattern.subn(lambda _match: validate_replacement, canonical)/' scripts/patch-atis-v46-2.py
          python3 scripts/patch-atis-v46-2.py
      - name: Run regressions
        run: |
          deno test supabase/functions/_shared/atis/semantic-bible_test.ts
          deno test supabase/functions/_shared/atis/canonical-bible_test.ts
          deno test supabase/functions/_shared/atis/context-routing_test.ts
          deno test supabase/functions/_shared/atis/link-policy_test.ts
      - name: Type-check production runtimes
        run: |
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts
      - name: Commit functional changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-atis-v46-2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/atis/canonical-bible.ts \
                  supabase/functions/_shared/atis/canonical-bible_test.ts \
                  supabase/functions/_shared/atis/semantic-bible.ts \
                  supabase/functions/_shared/atis/semantic-bible_test.ts \
                  scripts/patch-atis-v46-2.py
          git commit -m "fix(atis): harden canonical semantic grounding"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
