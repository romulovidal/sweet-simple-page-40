name: ATIS v46 Semantic Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atis-v46-semantic-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atis-v46-semantic-bible
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run ATIS canonical tests
        run: |
          deno test supabase/functions/_shared/atis/canonical-bible_test.ts
          deno test supabase/functions/_shared/atis/canonical-bible-universal_test.ts
          deno test supabase/functions/_shared/atis/context-routing_test.ts
          deno test supabase/functions/_shared/atis/link-policy_test.ts
      - name: Type-check production functions
        run: |
          deno check supabase/functions/atis-ai/index.ts
          deno check supabase/functions/atis-webhook/index.ts
          deno check supabase/functions/atis-bible-indexer/index.ts
