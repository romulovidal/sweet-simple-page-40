name: Deploy ATIS Webhook Review Branch

on:
  push:
    branches:
      - agent/atis-backend-hardening-context
    paths:
      - 'supabase/functions/atis-webhook/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-atis-webhook-branch.yml'

permissions:
  contents: read

jobs:
  deploy-atis-webhook:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Deploy ATIS webhook only
        run: supabase functions deploy atis-webhook --project-ref "$SUPABASE_PROJECT_ID"
