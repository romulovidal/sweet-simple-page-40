name: Patch ATIS Mobile Devotional

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-atis-mobile-devotional.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply ATIS patch
        run: python3 .github/scripts/patch_atis_mobile_devotional.py

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add mobile-first ATIS and daily devotional"
          git push origin HEAD:main
