name: Patch ATIS Birthday DDMM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-birthday-ddmm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch birthday code
        run: python3 .github/scripts/patch_birthday_ddmm.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use DD/MM for ATIS birthdays"
          git push origin HEAD:main
