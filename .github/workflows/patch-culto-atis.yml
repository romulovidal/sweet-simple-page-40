name: Patch ATIS Culto Routing

on:
  push:
    paths:
      - '.github/workflows/patch-culto-atis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch assistant routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/_shared/atis/assistant.ts')
          s = p.read_text()
          old = 'import { aiChatFetchWithProviders } from "../ai-fetch.ts";\n'
          new = old + 'import { cultoLookup, isCultoIntent } from "./culto-lookup.ts";\n'
          if 'from "./culto-lookup.ts"' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '  | "harpa_lookup";'
          new = '  | "harpa_lookup"\n  | "culto_info";'
          if '| "culto_info"' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          marker = 'function deterministicIntent(message: string): AtisAssistantRoute | null {\n  const q = normalize(message);\n'
          if 'if (isCultoIntent(message)) return "culto_info";' not in s:
              assert marker in s
              s = s.replace(marker, marker + '  if (isCultoIntent(message)) return "culto_info";\n', 1)

          old = '"birthdays", "bible_lookup", "harpa_lookup"]'
          new = '"birthdays", "bible_lookup", "harpa_lookup", "culto_info"]'
          if '"harpa_lookup", "culto_info"]' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          marker = '  if (route === "birthdays") {\n'
          branch = '  if (route === "culto_info") {\n    return { text: await cultoLookup(supabase, input), route, source: "database" };\n  }\n'
          if 'route === "culto_info"' not in s:
              assert marker in s
              s = s.replace(marker, branch + marker, 1)

          p.write_text(s)
          PY
      - name: Validate Deno files
        run: |
          npx --yes deno@2.4.5 check supabase/functions/_shared/atis/culto-lookup.ts
          npx --yes deno@2.4.5 check supabase/functions/_shared/atis/assistant.ts
      - name: Validate frontend build
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/atis/assistant.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: let ATIS answer culto schedule and ministry questions"
          git push
