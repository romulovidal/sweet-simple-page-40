name: Remove retired ATIS Edge Functions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-retired-atis-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Validate target project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test "$SUPABASE_PROJECT_ID" = "karyuuhxeismshhxuokg"

      - name: Delete retired ATIS Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            atis-birthday-greeting
            atis-broadcast-runner
            atis-daily-devotional
            atis-daily-verse-dm
            atis-instance
            atis-plans-runner
            atis-send
            atis-series-runner
            atis-webhook
            atis-welcome-runner
          )

          for fn in "${functions[@]}"; do
            code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
              -X DELETE \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/functions/${fn}" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json")

            case "$code" in
              200|204|404)
                echo "$fn -> $code"
                ;;
              *)
                echo "Failed deleting $fn (HTTP $code)" >&2
                cat /tmp/response.txt >&2
                exit 1
                ;;
            esac
          done
