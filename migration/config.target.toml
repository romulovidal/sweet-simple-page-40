# ============================================================================
# config.target.toml — conteúdo destinado a substituir supabase/config.toml
# no repositório que fará o deploy no projeto karyuuhxeismshhxuokg.
#
# NÃO substitua supabase/config.toml enquanto o app ainda roda no Lovable Cloud:
# aquele arquivo é gerenciado automaticamente. O deploy-functions.ps1 faz a troca
# temporária (backup + restore) sozinho.
#
# Regra aplicada: verify_jwt = false SOMENTE em endpoints realmente públicos
# (webhook com segredo próprio, links curtos, imagens OG) e em endpoints usados
# por visitantes não logados (a nova publishable key NÃO é um JWT e seria
# rejeitada por verify_jwt = true). Todas as demais permanecem com JWT exigido.
# Os jobs de cron NÃO desativam JWT: usam service_role via private.edge_call().
# ============================================================================
project_id = "karyuuhxeismshhxuokg"

# --- Públicas por natureza -------------------------------------------------
[functions.atis-webhook]
verify_jwt = false          # protegida por ATIS_WEBHOOK_SECRET no código

[functions.s]
verify_jwt = false          # link curto /v/:slug (rewrite Vercel)

[functions.cs]
verify_jwt = false          # link curto /c/:slug (rewrite Vercel)

[functions.og]
verify_jwt = false          # imagem OG lida por crawlers

[functions.og-culto]
verify_jwt = false          # imagem OG lida por crawlers

# --- Usadas por visitantes não autenticados --------------------------------
[functions.track-event]
verify_jwt = false

[functions.track-device]
verify_jwt = false

[functions.tts-verse]
verify_jwt = false

[functions.exegetai]
verify_jwt = false

[functions.ai-tools]
verify_jwt = false

[functions.create-verse-share]
verify_jwt = false

[functions.create-culto-share]
verify_jwt = false

[functions.push-subscription]
verify_jwt = false

# Todas as outras ficam no padrão verify_jwt = true.